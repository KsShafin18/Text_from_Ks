<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Text - Text From Ks Shafin</title>
</head>
<body>
    <h3 id="saved-text"></h3>

    <script type="module">
        const savedTextElement = document.getElementById("saved-text");

        try {
            const response = await fetch("/api/text", { cache: "no-store" });
            if (!response.ok) {
                let message = "Could not load text.";
                try {
                    const result = await response.json();
                    if (typeof result.error === "string") {
                        message = result.error;
                    }
                } catch (error) {
                    console.error("Could not read the text API error.", error);
                }
                throw new Error(message);
            }
            savedTextElement.textContent = await response.text();
        } catch (error) {
            console.error("Could not load text.", error);
            savedTextElement.textContent = error.message || "Could not load text.";
        }
    </script>
</body>
</html>
