<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajob Chatting -_- </title>
</head>
<body>
  <h3 id="output"></h3>

  <script>
    const params = new URLSearchParams(window.location.search);
    const textFromUrl = params.get("text");
    const savedText = textFromUrl || localStorage.getItem("textFromKsShafin") || "";

    if (textFromUrl) {
      localStorage.setItem("textFromKsShafin", textFromUrl);
    }

    document.getElementById("output").textContent = savedText;
  </script>
</body>
</html>
