<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;

        body {

            place-items: center;
            padding: 24px;
            background: #f3f6fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 480px);

            background: white;

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            padding: 12px 20px;
            border-radius: 8px;
            background: #2864dc;

            font-weight: 700;
            text-decoration: none;
