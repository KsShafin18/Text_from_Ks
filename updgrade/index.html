<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextFromKsShafin</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    main {
      width: min(520px, calc(100% - 32px));
      padding: 28px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .options a {
      padding: 10px 18px;
      border: 1px solid #555;
      border-radius: 6px;
      color: #222;
      text-decoration: none;
    }

    .options a:hover {
      background: #222;
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Text From Ks Shafin</h1>
    <div class="options">
      <a href="/text/">View Text</a>
      <a href="/send/">Set Text</a>
    </div>
  </main>
</body>
</html>
