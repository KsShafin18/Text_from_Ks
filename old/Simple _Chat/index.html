<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Text from Ks</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      padding: 32px;
      border: 1px solid #e3e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px #17203312;
    }

    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .hint { margin: 0 0 22px; color: #687386; }

    textarea, #saved-text {
      width: 100%;
      min-height: 240px;
      padding: 16px;
      border: 1px solid #cfd7e4;
      border-radius: 10px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    textarea { resize: vertical; }
    textarea:focus { outline: 3px solid #2563eb30; border-color: #2563eb; }
    #saved-text { white-space: pre-wrap; }

    button {
      margin-top: 16px;
      padding: 11px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled { opacity: .65; cursor: wait; }
    a { color: #2563eb; }
    #status { min-height: 1.5em; margin: 12px 0 0; color: #b42318; }
    @media (max-width: 520px) { main { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Text from Ks</h1>
    <p class="hint" id="hint"></p>
    <form id="write-form" hidden>
      <label for="text-input">এখানে আপনার লেখা লিখুন</label>
      <textarea id="text-input" maxlength="10000" required></textarea>
      <button id="save-button" type="submit">Save</button>
    </form>
    <div id="saved-text" hidden></div>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="write-link" href="/textlikha" hidden>লেখা লিখুন</a>
  </main>
  <script>
    const form = document.querySelector("#write-form");
    const input = document.querySelector("#text-input");
    const status = document.querySelector("#status");
    const savedText = document.querySelector("#saved-text");
    const path = window.location.pathname.replace(/\/+$/, "") || "/";

    if (path === "/textlikha") {
      document.querySelector("#title").textContent = "আপনার লেখা";
      document.querySelector("#hint").textContent = "লেখাটি Save করলে /text পেজে দেখা যাবে।";
      form.hidden = false;
    } else {
      document.querySelector("#title").textContent = "সংরক্ষিত লেখা";
      document.querySelector("#hint").textContent = "এখানে সর্বশেষ Save করা লেখাটি দেখা যাবে।";
      document.querySelector("#write-link").hidden = false;

      fetch("/api/text")
        .then(async (response) => {
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "লেখা লোড করা যায়নি।");
          savedText.textContent = result.text || "এখনো কোনো লেখা Save করা হয়নি।";
          savedText.hidden = false;
        })
        .catch((error) => { status.textContent = error.message; });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      const button = document.querySelector("#save-button");
      button.disabled = true;
      button.textContent = "Saving...";

      try {
        const response = await fetch("/api/text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "লেখা Save করা যায়নি।");
        window.location.assign("/text");
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
        button.textContent = "Save";
      }
    });
  </script>
</body>
</html>
